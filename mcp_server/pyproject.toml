[project]
name = "vehicle-npi-mcp"
version = "0.1.0"
description = "Stdio MCP adapter for the Vehicle NPI Platform HTTP API"
requires-python = ">=3.11"
dependencies = ["mcp>=1.28,<2", "httpx>=0.27,<1"]

[project.scripts]
npi-mcp = "npi_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["npi_mcp"]
