name: Validate Vehicle NPI AMP

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade -r requirements.txt ./mcp_server
          python -m pip check
          python -c "from importlib.metadata import version; v = version('mcp'); assert int(v.split('.')[0]) == 1, v; print('mcp', v)"
      - name: Validate AMP metadata
        run: python cai_integration/validate_amp.py
      - name: Run backend and MCP tests
        run: python -m pytest 02_backend/tests mcp_server/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: 03_frontend/package-lock.json
      - name: Build and lint frontend
        working-directory: 03_frontend
        run: |
          npm ci
          npm run build
          npm run lint
